services:
  jenkins-controller:
    build:
      context: ./controller
      dockerfile: Dockerfile
    container_name: jenkins-controller
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin123}
      JENKINS_URL: ${JENKINS_URL:-http://localhost:8080/}
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Dhudson.model.DirectoryBrowserSupport.CSP="
      CASC_JENKINS_CONFIG: "/var/jenkins_home/casc"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./controller/casc:/var/jenkins_home/casc:ro
      - ./secrets/id_ed25519:/run/secrets/id_ed25519:ro
    networks:
      - jenkins-net

  jenkins-agent-ssh:
    build:
      context: ./agents/ssh-agent
      dockerfile: Dockerfile
    container_name: jenkins-agent-ssh
    restart: unless-stopped
    environment:
      JENKINS_AGENT_SSH_PUBKEY: "${JENKINS_AGENT_SSH_PUBKEY}"
    networks:
      - jenkins-net
    depends_on:
      - jenkins-controller

  jenkins-agent-inbound:
    build:
      context: ./agents/inbound-agent
      dockerfile: Dockerfile
    container_name: jenkins-agent-inbound
    restart: unless-stopped
    environment:
      JENKINS_URL: http://jenkins-controller:8080
      JENKINS_AGENT_NAME: linux-inbound-agent-02
      JENKINS_USER: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_PASS: ${JENKINS_ADMIN_PASSWORD:-admin123}
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
    networks:
      - jenkins-net
    depends_on:
      - jenkins-controller

networks:
  jenkins-net:
    name: jenkins-net
    driver: bridge

volumes:
  jenkins_home:
    name: jenkins_home
