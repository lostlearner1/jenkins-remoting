jenkins:
  systemMessage: "Jenkins Remoting Cluster - Master Controller (Zero Local Executors)"
  numExecutors: 0
  mode: NORMAL
  scmCheckoutRetryCount: 2
  slaveAgentPort: 50000
  remotingSecurity:
    enabled: true

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin123}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  nodes:
    - permanent:
        name: "linux-ssh-agent-01"
        nodeDescription: "Linux x86_64 Worker connected via SSH Jenkins Remoting"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 2
        labelString: "linux x86_64 ssh docker-host"
        mode: EXCLUSIVE
        retentionStrategy: "always"
        launcher:
          ssh:
            host: "jenkins-agent-ssh"
            port: 22
            credentialsId: "agent-ssh-key"
            sshHostKeyVerificationStrategy:
              nonVerifyingKeyVerificationStrategy: {}

    - permanent:
        name: "linux-inbound-agent-02"
        nodeDescription: "Linux Inbound/JNLP Worker connected via TCP Remoting"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 2
        labelString: "linux alpine inbound-agent arm-emulated"
        mode: EXCLUSIVE
        retentionStrategy: "always"
        launcher:
          inbound: {}

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "agent-ssh-key"
              username: "jenkins"
              description: "SSH Private Key for Remote Agent Execution"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/id_ed25519}"

unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8080/}"
    adminAddress: "admin@example.com"

jobs:
  - file: /var/jenkins_home/casc/jobs.groovy
